<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #06070B;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 512px;
            height: 512px;
            background: #090A0F;
            border-radius: 50%;
            box-shadow: 0 0 80px rgba(139, 92, 246, 0.25);
        }
    </style>
</head>
<body>
    <div class="icon-box">
        <svg viewBox="0 0 240 240" width="300" height="300">
            <path d="M 115 25 L 60 80 L 115 135 L 170 80" fill="none" stroke="#8B5CF6" stroke-width="16" stroke-linecap="square" />
            <path d="M 100 40 L 45 95 L 100 150 L 155 95" fill="none" stroke="#EC4899" stroke-width="16" stroke-linecap="square" />
            <rect x="180" y="45" width="16" height="16" fill="#EC4899" transform="rotate(45 188 53)" />
            <rect x="198" y="27" width="16" height="16" fill="#EC4899" transform="rotate(45 206 35)" />
        </svg>
    </div>
</body>
</html>
